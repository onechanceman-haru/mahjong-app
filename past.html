<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>シーズン管理 | 公大中麻雀倶楽部</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="stats.js"></script>
  <link rel="stylesheet" href="common.css">
</head>
<body>

<header class="header">
  <div class="header-logo">🀄</div>
  <div class="header-title">公大中麻雀倶楽部</div>
  <div class="header-badge">シーズン</div>
</header>

<div class="container">

  <div class="card">
    <div class="card-header">＋ シーズンを追加</div>
    <div class="form-group" style="margin-bottom:12px">
      <input type="text" id="season-name-input" class="form-input" placeholder="例：シーズン4(令和9年度)">
    </div>
    <button id="add-btn" class="btn btn-primary" onclick="addSeason()">追加</button>
  </div>

  <div id="season-list">
    <div class="loading"><div class="spinner"></div>読み込み中...</div>
  </div>

  <div class="ranking-card">
    <div class="ranking-title">🏆 全シーズン通算成績</div>
    <div id="all-score-ranking"><div class="loading"><div class="spinner"></div>読み込み中...</div></div>
  </div>

  <div class="ranking-card">
    <div class="ranking-title">🎯 全シーズンチップ枚数ランキング</div>
    <div id="all-chip-ranking"><div class="loading"><div class="spinner"></div>読み込み中...</div></div>
  </div>

  <a href="index.html" class="btn btn-past" style="margin-bottom:16px;text-decoration:none">← ホームに戻る</a>

</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = 'https://kqrevvjhfkxfuitngyoc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxcmV2dmpoZmt4ZnVpdG5neW9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzUzMDIsImV4cCI6MjA5NTAxMTMwMn0.bRFBt3KQ3R8IhZRjjVs6DWtWvFFJyt45pYTTxXDGevs';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let seasons = [];

async function init() {
  await Promise.all([loadSeasons(), loadAllRankings()]);
}

async function loadSeasons() {
  const { data, error } = await sb.from('seasons').select('*');
  if (error) { toast('読み込みに失敗しました', 'error'); return; }
  seasons = (data || []).sort((a, b) => {
    const na = parseInt(a.name.match(/\d+/)?.[0]);
    const nb = parseInt(b.name.match(/\d+/)?.[0]);
    if (isNaN(na) && isNaN(nb)) return b.id - a.id; // 両方数字なし→新しい順
    if (isNaN(na)) return -1; // aが数字なし→先頭
    if (isNaN(nb)) return 1;  // bが数字なし→先頭
    return nb - na;           // 両方数字あり→大きい順
  });
  renderSeasons();
}

function renderSeasons() {
  const el = document.getElementById('season-list');
  if (!seasons.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div>シーズンがありません</div>'; return;
  }
  el.innerHTML = seasons.map(s => {
    const d = new Date(s.created_at).toLocaleDateString('ja-JP', { year:'numeric', month:'short', day:'numeric' });
    return `<div class="season-card">
      <div class="season-name">${esc(s.name)}</div>
      <div class="season-date">作成日：${d}</div>
      <div class="season-actions">
        <a href="index.html?season=${s.id}" class="btn btn-outline btn-sm" style="text-decoration:none;flex:1">🏠 ホームへ</a>
        <button class="btn btn-danger btn-sm" onclick="deleteSeason(${s.id})" style="flex:1">🗑 削除</button>
      </div>
    </div>`;
  }).join('');
}

// 全シーズン通算は「現存するシーズンに属するデータだけ」を
// シーズン別（index.html の総合タブ）と同じルールで集計する
async function loadAllRankings() {
  const [{ data: playerData }, { data: seasonData }] = await Promise.all([
    sb.from('players').select('id, name'),
    sb.from('seasons').select('id')
  ]);
  // ページング取得は index.html と同じ order('id') + range() で行う
  const [games, results, chips] = await Promise.all([
    mjFetchAllRows(() => sb.from('games').select('*').order('id', { ascending: true })),
    mjFetchAllRows(() => sb.from('game_results').select('*').order('id', { ascending: true })),
    mjFetchAllRows(() => sb.from('chip_settlements').select('*').order('id', { ascending: true }))
  ]);

  const data = mjScopeToSeasons(
    { players: playerData || [], games, results, chips },
    (seasonData || []).map(s => s.id)
  );

  renderScoreRanking(mjExcludeFromTotal(mjComputeStats(data, null)));
  renderChipRanking(mjExcludeFromTotal(mjComputeChipCounts(data)));
}

function renderScoreRanking(stats) {
  const el = document.getElementById('all-score-ranking');
  const entries = stats.map(s => ({ name: s.name, total: s.totalPt, games: s.games }));

  if (!entries.length) {
    el.innerHTML = '<div class="empty-state" style="padding:16px"><div class="empty-icon">📊</div>データがありません</div>'; return;
  }
  el.innerHTML = `<div class="ranking-header">
    <div style="width:38px;flex-shrink:0"></div>
    <div class="ranking-header-name">プレイヤー</div>
    <div class="ranking-header-games">対局数</div>
    <div class="ranking-header-val">総合収支 (pt)</div>
  </div>` + entries.map((e, i) => {
    const rank = i + 1;
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    const cls   = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : 'other';
    const sign  = e.total >= 0 ? '+' : '';
    const color = e.total >= 0 ? 'var(--pos)' : 'var(--neg)';
    return `<div class="ranking-row">
      <div class="rank-badge ${cls}${rank <= 3 ? ' medal' : ''}">${medal}</div>
      <div class="ranking-name">${esc(e.name)}</div>
      <div class="ranking-games">${e.games}</div>
      <div class="ranking-val" style="color:${color};width:96px">${sign}${e.total.toLocaleString()}</div>
    </div>`;
  }).join('');
}

function renderChipRanking(chipStats) {
  const el = document.getElementById('all-chip-ranking');
  const entries = chipStats.map(c => ({ name: c.name, total: c.chips }));

  if (!entries.length) {
    el.innerHTML = '<div class="empty-state" style="padding:16px"><div class="empty-icon">🎯</div>データがありません</div>'; return;
  }
  el.innerHTML = entries.map((e, i) => {
    const rank = i + 1;
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    const cls   = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : 'other';
    const sign  = e.total >= 0 ? '+' : '';
    const color = e.total >= 0 ? 'var(--pos)' : 'var(--neg)';
    return `<div class="ranking-row">
      <div class="rank-badge ${cls}${rank <= 3 ? ' medal' : ''}">${medal}</div>
      <div class="ranking-name">${esc(e.name)}</div>
      <div class="ranking-val" style="color:${color}">${sign}${e.total.toLocaleString()} 枚</div>
    </div>`;
  }).join('');
}

async function addSeason() {
  const name = document.getElementById('season-name-input').value.trim();
  if (!name) { toast('シーズン名を入力してください', 'error'); return; }
  const btn = document.getElementById('add-btn');
  btn.disabled = true; btn.textContent = '追加中...';
  const { error } = await sb.from('seasons').insert({ name });
  btn.disabled = false; btn.textContent = '追加';
  if (error) { toast('追加に失敗しました', 'error'); return; }
  document.getElementById('season-name-input').value = '';
  toast(`${name} を追加しました ✓`, 'success');
  await loadSeasons();
}

async function deleteSeason(id) {
  const s = seasons.find(x => x.id === id);
  const label = s ? s.name : 'このシーズン';
  if (!confirm(`「${label}」を削除しますか？\n※対局・チップデータは削除されません`)) return;

  const { data: linked } = await sb.from('games').select('id').eq('season_id', id).limit(1);
  if (linked && linked.length > 0) {
    toast('対局データが紐付いているため削除できません', 'error'); return;
  }

  // チップ記録が残っていると通算集計から漏れるため、こちらも確認する
  const { data: linkedChips } = await sb.from('chip_settlements').select('id').eq('season_id', id).limit(1);
  if (linkedChips && linkedChips.length > 0) {
    toast('チップデータが紐付いているため削除できません', 'error'); return;
  }

  const { error } = await sb.from('seasons').delete().eq('id', id);
  if (error) { toast('削除に失敗しました', 'error'); return; }
  toast('削除しました ✓', 'success');
  await loadSeasons();
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast show ${type}`;
  clearTimeout(el._t); el._t = setTimeout(() => { el.className = 'toast'; }, 3000);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
