<!-- 入力: input.html と同じ並び順（タブ / 1 グループ登録 / グループ選択 / 2 対局設定 / 3 結果入力） -->
<header class="header">
  <svg class="logo-mark" viewBox="0 0 18 24" aria-hidden="true">
    <rect x="0.75" y="0.75" width="16.5" height="22.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="4.5" y="5" width="9" height="1.6" rx="0.8"/><rect x="4.5" y="9" width="9" height="1.6" rx="0.8"/><rect x="4.5" y="13" width="9" height="1.6" rx="0.8"/>
  </svg>
  <div class="logo-type">入力</div>
  <div class="season-tag">シーズン3(令和8年度)</div>
</header>

<div class="tab-bar-main" role="tablist">
  <button class="tab-main" role="tab" aria-selected="true">対局入力</button>
  <button class="tab-main" role="tab" aria-selected="false">チップ精算</button>
  <button class="tab-main" role="tab" aria-selected="false">プレイヤー</button>
</div>

<div class="container">

  <div class="section-header"><span class="section-num">1</span><span class="section-title">グループ登録</span></div>
  <div class="card">
    <div class="card-header">日付・グループを登録</div>
    <div class="form-group">
      <label class="form-label">対局日</label>
      <input class="form-input" type="date" value="2026-10-08">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">グループ名（省略すると日付が自動設定されます）</label>
      <input class="form-input" placeholder="例：土曜定例">
    </div>
    <button class="btn btn-outline btn-sm">グループを登録</button>
  </div>
  <div class="card">
    <div class="card-header">グループを選択</div>
    <div class="row">
      <select class="form-input grow"><option>A卓</option><option>2026/10/06</option></select>
      <button class="btn btn-danger btn-sm" style="flex-shrink:0">削除</button>
    </div>
  </div>

  <div class="section-header"><span class="section-num">2</span><span class="section-title">対局設定</span></div>
  <div class="card">
    <div class="info-badge">10/8（水）· A卓</div>
    <div class="form-group">
      <label class="form-label">参加人数</label>
      <div class="toggle-group">
        <button class="toggle-btn" aria-pressed="false">3人打ち</button>
        <button class="toggle-btn" aria-pressed="true">4人打ち</button>
        <button class="toggle-btn" aria-pressed="false">5人打ち</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">順位点設定</label>
      <div class="rank-pt-grid">
        <div class="rank-pt-row"><span class="rank-pt-label">1位</span><input class="rank-pt-input" value="2000"><span class="rank-pt-suffix">pt</span></div>
        <div class="rank-pt-row"><span class="rank-pt-label">2位</span><input class="rank-pt-input" value="1000"><span class="rank-pt-suffix">pt</span></div>
        <div class="rank-pt-row"><span class="rank-pt-label">3位</span><input class="rank-pt-input" value="-1000"><span class="rank-pt-suffix">pt</span></div>
        <div class="rank-pt-row"><span class="rank-pt-label">4位</span><input class="rank-pt-input" value="-2000"><span class="rank-pt-suffix">pt</span></div>
      </div>
      <div class="rank-sum pos">順位点合計 ±0 pt</div>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">参加者選択（タップで選択）</label>
      <div class="player-grid">
        <button class="player-chip" aria-pressed="true">安部</button>
        <button class="player-chip" aria-pressed="true">豊田</button>
        <button class="player-chip" aria-pressed="true">井上</button>
        <button class="player-chip" aria-pressed="true">谷口</button>
        <button class="player-chip" aria-pressed="false">酒井</button>
        <button class="player-chip" aria-pressed="false">中田</button>
      </div>
      <div class="selected-count">4/4名 選択中</div>
    </div>
  </div>

  <div class="section-header"><span class="section-num">3</span><span class="section-title">結果入力</span></div>
  <div class="card">
    <div class="card-header">素点を入力（100点単位）</div>

    <div class="game-row">
      <div class="game-row-main">
        <span class="game-row-name">安部</span>
        <button class="sign-btn" data-sign="plus">＋</button>
        <span class="game-row-input"><input class="form-input input-n" inputmode="numeric" value="423"></span>
        <span class="game-row-00">00</span>
      </div>
      <div class="game-row-live"><b>1位</b><span>+730</span><span>順位点 +2,000</span><span class="pos">合計 +2,730 pt</span></div>
    </div>
    <div class="game-row">
      <div class="game-row-main">
        <span class="game-row-name">豊田</span>
        <button class="sign-btn" data-sign="plus">＋</button>
        <span class="game-row-input"><input class="form-input input-n" inputmode="numeric" value="366"></span>
        <span class="game-row-00">00</span>
      </div>
      <div class="game-row-live"><b>2位</b><span>+160</span><span>順位点 +1,000</span><span class="pos">合計 +1,160 pt</span></div>
    </div>
    <div class="game-row">
      <div class="game-row-main">
        <span class="game-row-name">井上</span>
        <button class="sign-btn" data-sign="plus">＋</button>
        <span class="game-row-input"><input class="form-input input-n" inputmode="numeric" value="351"></span>
        <span class="game-row-00">00</span>
      </div>
      <div class="game-row-live"><b>3位</b><span>+10</span><span>順位点 −1,000</span><span class="neg">合計 −990 pt</span></div>
    </div>
    <div class="game-row">
      <div class="game-row-main">
        <span class="game-row-name">谷口</span>
        <button class="sign-btn" data-sign="minus">－</button>
        <span class="game-row-input"><input class="form-input input-n" inputmode="numeric" value="31"></span>
        <span class="game-row-00">00</span>
      </div>
      <div class="game-row-live"><b>4位</b><span>−3,810</span><span>順位点 −2,000</span><span class="neg">合計 −5,810 pt</span></div>
    </div>

    <div class="score-summary">
      <span class="score-label">入力合計</span>
      <span class="score-val err">138,600 <span class="dim">/ 140,000</span></span>
    </div>
    <div class="score-hint err">残り +1,400点</div>
    <div style="margin-top:12px"><button class="btn btn-outline">残りを自動入力</button></div>
    <div style="margin-top:8px"><button class="btn btn-primary" disabled>対局登録</button></div>
  </div>

</div>

<!--NAV:input-->
